<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
<title>Lista de Compras</title>
<meta name="description" content="Lista de compras simple, rapida y sin cuentas. Funciona sin internet." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Lista" />
<meta name="theme-color" content="#f2f4f8" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5h6M9 12h6M9 19h6" />
          <path d="M4 5l1.5 1.5L8 4" />
          <path d="M4 12l1.5 1.5L8 11" />
          <path d="M4 19l1.5 1.5L8 18" />
        </svg>
      </span>
      <div class="brand-text">
        <h1>Lista de compras</h1>
        <p id="stats" class="stats">&nbsp;</p>
      </div>
    </div>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
  </header>

  <form id="addForm" class="add" autocomplete="off">
    <input id="nameInput" class="field field-name" type="text" placeholder="Agregar algo..." maxlength="80" aria-label="Articulo" />
    <input id="qtyInput" class="field field-qty" type="text" placeholder="Cant." maxlength="24" aria-label="Cantidad" />
    <button class="btn-add" type="submit" aria-label="Agregar a la lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <nav class="filters" aria-label="Filtros">
    <button class="chip is-active" type="button" data-filter="all">Todos</button>
    <button class="chip" type="button" data-filter="pending">Pendientes</button>
    <button class="chip" type="button" data-filter="done">Comprados</button>
    <span class="spacer"></span>
    <button id="shareBtn" class="chip ghost" type="button" title="Compartir la lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
      <span>Compartir</span>
    </button>
  </nav>

  <main class="main">
    <ul id="list" class="list"></ul>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5h6M9 12h6M9 19h6"/><path d="M4 5l1.5 1.5L8 4"/><path d="M4 12l1.5 1.5L8 11"/><path d="M4 19l1.5 1.5L8 18"/>
        </svg>
      </div>
      <p id="emptyText">No hay nada en la lista</p>
      <span class="empty-sub">Agrega tu primer articulo arriba</span>
    </div>
  </main>

  <footer class="foot">
    <button id="clearDone" class="link-btn" type="button">Borrar comprados</button>
    <span class="spacer"></span>
    <button id="exportBtn" class="link-btn" type="button">Exportar</button>
    <button id="importBtn" class="link-btn" type="button">Importar</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden />
  </footer>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="sheetTitle">Editar articulo</h2>
    <label class="row">
      <span>Articulo</span>
      <input id="editName" type="text" maxlength="80" autocomplete="off" />
    </label>
    <label class="row">
      <span>Cantidad</span>
      <input id="editQty" type="text" maxlength="24" autocomplete="off" />
    </label>
    <label class="row">
      <span>Nota</span>
      <input id="editNote" type="text" maxlength="80" autocomplete="off" />
    </label>
    <div class="sheet-actions">
      <button id="editCancel" class="btn ghost" type="button">Cancelar</button>
      <button id="editSave" class="btn primary" type="button">Guardar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden>
  <span id="toastText"></span>
  <button id="toastAction" class="toast-btn" type="button" hidden></button>
</div>

<script src="app.js" defer></script>
</body>
</html>
